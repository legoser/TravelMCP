http:
  addr: ":8080"
  rate_limit: { rps: 1000, burst: 2000 }

store:
  kind: "memory"
  dsn: "memory"

providers:
  enabled: ["synth"]
  intercity:
    reestr_path: "testdata/reestr/mini.json"

log:
  level: "warn"
  format: "text"

planner:
  engine: "csa"
  semaphore_enable: false

auth:
  admin_token: "test-secret"
