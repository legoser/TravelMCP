http:
  addr: ":8080"
  read_header_timeout: "10s"
  shutdown_timeout: "10s"
  rate_limit: { rps: 100, burst: 200 } # дефолт; переопределения см. docs/10-observability.md
  # rate_limit_overrides:
  #   "/api/v1/login": { rps: 5, burst: 10 }
  #   "/mcp": { rps: 20, burst: 40 }

store:
  kind: "postgres" # postgres|memory
  # postgres: dsn: "postgres://user:***@localhost:5432/travelmcp?sslmode=disable"
  dsn: "${DATABASE_DSN:-}" # env DATABASE_DSN или TRAVELMCP__STORE__DSN

cache:
  kind: "memory" # memory|redis
  addr: ""
  ttl: "1440m"

queue:
  kind: "memory" # memory|nats
  url: ""

providers:
  # По умолчанию источников нет: реальные провайдеры подключаются по мере
  # реализации. Мок synth для демо/тестов включается явно:
  #   PROVIDERS_ENABLED=synth
  enabled: []
  # Legacy JSON-провайдер intercity вырезан (Фаза 6): минтранс-данные
  # попадают в канон конвейером trips-sync, сеть строит Store.
  gtfs:
    path: "data/gtfs/feed.zip"

auth:
  admin_token: "${ADMIN_TOKEN}" # dev: export ADMIN_TOKEN=dev-secret; prod — env обязателен

planner:
  engine: "csa" # csa|raptor (RAPTOR frequency-based для межгорода)
  semaphore_enable: true
  semaphore_size: 0 # 0 = NumCPU*2, иначе явный размер
  max_walk_minutes: 30 # дефолт пешей доступности, если запрос не задал; междугородние автовокзалы часто за окраиной — можно поднять (env PLANNER_MAX_WALK_MINUTES)

log:
  level: "info" # debug|info|warn|error — переключение без пересборки (LOG_LEVEL env)
  format: "json" # json|text — json для prod/логов, text с цветом для консоли
  add_source: false # true — добавляет file:line в debug
  # per-модуль override: TRAVELMCP__LOG__LEVELS__STORE=debug
  levels:
    #planner: "info"
    #mcp: "info"
    # http: "info"
    # httpx: "debug" # внешние запросы подробно
  # Loki push: LOG_LOKI_URL=http://localhost:3100 (отключено если пусто)
  loki:
    url: "${LOG_LOKI_URL:-}" # вкл: LOG_LOKI_ENABLED=true и/или LOG_LOKI_URL=http://loki:3100

telemetry:
  otlp_metrics_url: "" # включить OTLP JSON endpoint на /api/v1/metrics/otlp (auth: mcp:read)

geocoder:
  # Приоритет по умолчанию: nominatim (OSM, бесплатно) -> yandex (требует ключ).
  # Провайдеры регистрируются, kind — опциональный приоритет (пусто = nominatim first).
  # При недоступности одного — фолбэк на следующий; attempts циклит по списку.
  kind: "" # nominatim|yandex|""
  attempts: 3 # попыток с фолбэком по приоритету [nominatim,yandex] (env GEOCODER_ATTEMPTS)
  limit: 5 # кандидатов за запрос к геокодеру, потолок 10 (env GEOCODER_LIMIT)
  max_calls: 0 # суточный лимит квоты api_quotas для геокодеров, 0 = дефолт вызывающей стороны (env GEOCODER_MAX_CALLS)
  ttl_verified: "2160h" # 90д — подтверждённые (Фаза 2, GEOCODER_TTL_VERIFIED)
  ttl_disputed: "168h" # 7д — спорные/seed (Фаза 2, GEOCODER_TTL_DISPUTED)

nominatim:
  url: "https://nominatim.openstreetmap.org"

overpass:
  url: "https://overpass-api.de/api/interpreter"
  mirror_url: "https://overpass.openstreetmap.fr/api/interpreter"

sync:
  log_dir: "${SYNC_LOG_DIR:-data/logs}" # файлы операций sync_<run>.log.jsonl (Фаза 1)
  coverage_gate: 0 # N% coverage-gate скелета, стартовый N — по Фазе 3 на Кузбассе (Фаза 4)
  skeleton_chunk_size: 100 # терминалов на чанк промоушена скелета, потолок 100 (§4.2)
  osm_path: "${SYNC_OSM_PATH:-data/osm/stations.json}"
  yandex_dump_path: "${SYNC_YANDEX_DUMP_PATH:-data/yandex/cache/global_stations_list.json}"
  skeleton_region: "${SYNC_SKELETON_REGION:-Кемеровская область - Кузбасс}" # пилотный регион скелета
  bbox: "${SYNC_BBOX:-53.5,84.0,57.0,88.5}" # minLat,minLon,maxLat,maxLon пилота
  # region_bboxes — bbox регионов для overpass-сбора (issue #12): сбор региона
  # берёт его bbox, а не молчаливый глобальный bbox пилота. Точечное
  # переопределение: SYNC_REGION_BBOX="Регион=lat,lon,lat,lon;...".
  region_bboxes:
    "Кемеровская область - Кузбасс": "53.5,82.5,57.5,89.5"
    "Алтайский край": "51.0,78.5,54.5,86.5"
    "Республика Алтай": "49.0,83.5,52.7,89.5"
    "Новосибирская область": "53.0,75.0,57.0,85.0"
    "Томская область": "56.0,75.5,60.5,88.5"
    "Омская область": "53.0,70.0,58.5,78.0"
    "Красноярский край": "51.0,82.0,61.0,89.5"
    "Иркутская область": "51.5,98.0,62.0,110.0"
    "Республика Хакасия": "51.5,86.5,55.5,92.0"
    "Республика Тыва": "49.5,87.5,53.5,100.0"
  flat_trips_path: "${SYNC_FLAT_TRIPS_PATH:-}" # flat_trips.json (генерирует tools/registry-parser) для coverage-замера и trips-sync
  legacy_threshold: 0.6 # порог legacy_match Фазы 0
  coverage_soft_score: 0.4 # мягкий порог ScorePair для coverage-gate (§5.4)
  trips_churn_threshold: 0.2 # churn-alert attach трипов: доля added+removed+changed за прогон, стоп при превышении (Фаза 4)
  trips_max_speed_kmh: 200 # физический предел скорости автобуса для hard-валидатора (Фаза 4.2)
  staging_expiry_days: 14 # протухшие staging_trips (last_attempt_at старше) → dead-letter state='expired', jobs{cleanup} (§5.3)

verification:
  confidence_threshold: 0.6
  distance_m: 500
  strong_distance_m: 200
  lev_threshold: 0.15
  score_margin: 0.1 # полоса ниже порога → review low_confidence (ScorePair, Фаза 4.1)
  score_ambiguity: 0.05 # зазор top1−top2 ниже → review duplicate_ambiguous (ScorePair, Фаза 4.1)
  density_thresholds:
    rural: { distance_m: 500, strong_distance_m: 200, lev_threshold: 0.15 }
    urban: { distance_m: 200, strong_distance_m: 100, lev_threshold: 0.10 }
    metro: { distance_m: 100, strong_distance_m: 50, lev_threshold: 0.10 }

pricing:
  default_currency: "RUB" # ISO 4217, поддерживаются RUB,USD,EUR,KZT,BYN,CNY; переопределение PRICING_DEFAULT_CURRENCY / TRAVELMCP__PRICING__DEFAULT_CURRENCY

# Секреты — только через env (или .env, gitignored); в YAML не заполняются.
yandex:
  rasp_key: "${YANDEX_RASP_KEY}"
  rasp_url: "${YANDEX_RASP_URL:-https://api.rasp.yandex.net/v3.0}" # дефолт URL расписаний
  geocode_key: "${YANDEX_GEOCODE_KEY}"
  geocode_url: "https://geocode-maps.yandex.ru/1.x"
